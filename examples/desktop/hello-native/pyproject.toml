[project]
name = "hello-native"
version = "0.1.0"
# Desktop example (macOS + Linux): each backend bundles CPython 3.13.14 (PBS)
# with Kivy 2.3.1 wheels from PyPI, plus two non-wheel native binaries built by
# build_native.sh (a helper executable + a shared library).
requires-python = ">=3.13"
dependencies = [
    "kivy>=2.3.1",
]

[tool.kivy]
display_name = "Hello Native"
app_dir = "src"
entry_point = "main"
orientation = ["portrait"]

[tool.kivy.macos]
schema_version = 1
bundle_id = "org.example.hello-native"
build = 1
archs = ["arm64", "x86_64"]
# Kivy's macOS wheel declares deps unused by this app; prune them so the lock
# stays lean.
exclude = [
    "kivy-garden",
    "requests",
    "certifi",
    "charset-normalizer",
    "idna",
    "urllib3",
    "docutils",
    "pygments",
]

[tool.kivy.macos.python]
version = "3.13.14"

# Two non-wheel native binaries, referenced by repo-relative source (built by
# ./build_native.sh into binaries/macos/). `kivyforge lock -p macos` SHA-256-pins
# each; the build stages them into Contents/Resources/bin and the signing sweep
# signs them. Signing is left at the ad-hoc default (no Team ID committed).
[tool.kivy.macos.native.binaries]
roll = { version = "0.1.0", source = "binaries/macos/roll" }
libgreet = { version = "0.1.0", source = "binaries/macos/libgreet.dylib" }

[tool.kivy.linux]
schema_version = 1
app_id = "org.example.hello-native"
archs = ["x86_64"]
# Kivy's Linux wheel declares deps unused by this app; prune them so the lock
# stays lean.
exclude = [
    "kivy-garden",
    "requests",
    "certifi",
    "charset-normalizer",
    "idna",
    "urllib3",
    "docutils",
    "pygments",
]

[tool.kivy.linux.python]
version = "3.13.14"

# The Linux siblings of the macOS binaries above (built by ./build_native.sh into
# binaries/linux/). `kivyforge lock -p linux` SHA-256-pins each; the build stages
# them into usr/bin, AppRun prepends usr/bin to PATH (roll runs by name) and
# appends it to LD_LIBRARY_PATH (libgreet.so loads by soname).
[tool.kivy.linux.native.binaries]
roll = { version = "0.1.0", source = "binaries/linux/roll" }
libgreet = { version = "0.1.0", source = "binaries/linux/libgreet.so" }

[tool.kivy.windows]
schema_version = 1
app_id = "Example.HelloNative"
archs = ["amd64"]
exclude = [
    "kivy-garden",
    "requests",
    "certifi",
    "charset-normalizer",
    "idna",
    "urllib3",
    "docutils",
    "pygments",
]

[tool.kivy.windows.python]
version = "3.13.14"

# The Windows siblings of the binaries above (built by ./build_native.sh into
# binaries/windows/ — see the Windows branch in that script). `kivyforge lock -p
# windows` SHA-256-pins each; the build stages them into bin\, and the generated
# bootstrap registers bin\ with os.add_dll_directory + prepends it to PATH, so
# roll.exe runs by name and greet.dll loads by name (ctypes.WinDLL("greet.dll")).
[tool.kivy.windows.native.binaries]
roll = { version = "0.1.0", source = "binaries/windows/roll.exe" }
greet = { version = "0.1.0", source = "binaries/windows/greet.dll" }
