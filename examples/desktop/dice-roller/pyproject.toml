[project]
name = "dice-roller"
version = "0.1.0"
# Desktop-only example: macOS bundles CPython 3.13.14 (PBS) with Kivy 2.3.1
# wheels from PyPI. (Mobile needs Kivy 3.0 — see examples/mobile.)
requires-python = ">=3.13"
dependencies = [
    "kivy>=2.3.1",
]

[tool.kivy]
display_name = "Dice Roller"
app_dir = "src"
entry_point = "main"
orientation = ["portrait"]

[tool.kivy.macos]
schema_version = 1
bundle_id = "org.example.dice-roller"
build = 1
archs = ["arm64", "x86_64"]
# Kivy's macOS wheel declares deps unused by this app; prune them so the lock
# stays lean (RST/CodeInput/UrlRequest widgets are not used here).
exclude = [
    "kivy-garden",
    "requests",
    "certifi",
    "charset-normalizer",
    "idna",
    "urllib3",
    "docutils",
    "pygments",
]

[tool.kivy.macos.icons]
# macOS: a 1024x1024 PNG with transparent rounded corners (rendered to .icns).
source = "assets/icon.png"

[tool.kivy.macos.python]
version = "3.13.14"

[tool.kivy.macos.signing]
identity = "Developer ID Application: ELLIOT DREW GARBUS (R5PKSQLUZY)"
team_id = "R5PKSQLUZY"
notary_profile = "kivyforge-notary"

# One pyproject.toml, two desktop lockfiles: the same [project]/[tool.kivy] now
# also targets Linux (AppImage/AppDir) from the same PyPI Kivy 2.3.1 wheels.
[tool.kivy.linux]
schema_version = 1
app_id = "org.example.dice-roller"
archs = ["x86_64"]
exclude = [
    "kivy-garden",
    "requests",
    "certifi",
    "charset-normalizer",
    "idna",
    "urllib3",
    "docutils",
    "pygments",
]

[tool.kivy.linux.icons]
# 1024x1024 PNG resized into the freedesktop hicolor set + root icon (Pillow).
source = "assets/icon.png"

[tool.kivy.linux.desktop]
categories = ["Game"]

[tool.kivy.linux.python]
version = "3.13.14"

# The same [project]/[tool.kivy] also targets Windows: an onedir bundle (a
# windowed launcher .exe beside a full python-build-standalone prefix) from the
# same PyPI Kivy 2.3.1 win_amd64 wheels. app_id is the AppUserModelID (PascalCase
# CompanyName.ProductName style — different from the reverse-DNS ids above).
[tool.kivy.windows]
schema_version = 1
app_id = "Example.DiceRoller"
# arm64: once native Windows-on-Arm support lands (docs/design/platforms/windows/
# arm64-windows.md), an app opts in with archs = ["arm64"] or ["amd64", "arm64"].
archs = ["amd64"]
exclude = [
    "kivy-garden",
    "requests",
    "certifi",
    "charset-normalizer",
    "idna",
    "urllib3",
    "docutils",
    "pygments",
]

[tool.kivy.windows.icons]
# 1024x1024 PNG rendered into a multi-resolution .ico for the launcher (Pillow).
source = "assets/icon.png"

[tool.kivy.windows.python]
version = "3.13.14"
