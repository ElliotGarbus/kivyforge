[project]
name = "notes"
version = "0.1.0"
# macOS bundles CPython 3.13.14 (PBS) with Kivy 2.3.1 wheels from PyPI; iOS uses
# the 3.15 wheels vendored under examples/wheels/ios.
requires-python = ">=3.13"
dependencies = [
    "kivy>=2.3.1",
    "platformdirs>=4",
]

[tool.kivy]
display_name = "Notes"
app_dir = "src"
entry_point = "main"
orientation = ["portrait"]

[tool.kivy.macos]
schema_version = 1
bundle_id = "org.example.notes"
build = 1
archs = ["arm64", "x86_64"]
exclude = [
    "kivy-garden",
    "requests",
    "certifi",
    "charset-normalizer",
    "idna",
    "urllib3",
    "docutils",
    "pygments",
]

[tool.kivy.macos.python]
version = "3.13.14"

[tool.kivy.ios]
schema_version = 1
bundle_id = "org.example.notes"
build = 1
deployment_target = "16.0"
find_links = ["../../wheels/ios"]
exclude = [
    "kivy-garden",
    "requests",
    "certifi",
    "charset-normalizer",
    "idna",
    "urllib3",
    "docutils",
    "pygments",
]

[tool.kivy.ios.python]
version = "3.15.0b2"

[tool.kivy.ios.signing]
team_id = ""
identity = "Apple Development"
provisioning_profile = ""
auto_signing = true
upload_symbols = true
