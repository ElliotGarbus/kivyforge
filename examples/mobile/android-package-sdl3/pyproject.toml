[project]
name = "android-package-sdl3"
version = "1.0.0"
description = "The bundled android package, checked on a device (Kivy 3.0, SDL3)"
requires-python = ">=3.14"
dependencies = [
    # Kivy 3.0 is unreleased, so the specifier has to admit a .dev version —
    # pip excludes pre-releases unless the requirement asks for one.
    "kivy>=3.0.0.dev0,<4",
    "pyjnius",
    "plyer",
]

[tool.kivy]
display_name = "Android Package SDL3"
app_dir = "src"
entry_point = "main"
orientation = ["portrait"]

[tool.kivy.android]
schema_version = 1
package = "org.kivyforge.androidpackagesdl3"
min_sdk = 24
target_sdk = 35
kivy_generation = 3
abis = ["arm64_v8a", "x86_64"]
extra_index_urls = ["https://elliotgarbus.github.io/kivy-mobile-wheels/simple/"]

# Kivy declares these unconditionally but nothing on Android needs them.
exclude = ["kivy-garden", "docutils", "pygments"]

[tool.kivy.android.python]
version = "3.14.6"

[tool.kivy.android.permissions]
uses = ["POST_NOTIFICATIONS"]
