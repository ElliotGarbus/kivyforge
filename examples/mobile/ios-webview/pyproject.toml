[project]
name = "ios-webview"
version = "0.1.0"
requires-python = ">=3.15"
dependencies = [
    "kivy>=3.0.0.dev0,<4",
    # Rubicon-ObjC calls UIKit and WebKit. It is pure Python, so its wheel
    # comes from PyPI; it is only imported on iOS (elsewhere the app shows a
    # desktop fallback). Kivy's iOS wheel comes from the kivy-mobile-wheels
    # index (see [tool.kivy.ios].extra_index_urls below).
    "rubicon-objc>=0.5.7",
]

[tool.kivy]
display_name = "iOS WebView Spike"
app_dir = "src"
entry_point = "main"
orientation = ["portrait"]

[tool.kivy.ios]
schema_version = 1
bundle_id = "org.kivy.ios-webview"
build = 1
deployment_target = "16.0"
extra_index_urls = ["https://elliotgarbus.github.io/kivy-mobile-wheels/simple/"]
# Kivy's wheel declares deps that are not needed at runtime on iOS.
# Remove an entry only if your app actually uses that feature.
exclude = [
    "kivy-garden",
    "requests",
    "certifi",
    "charset-normalizer",
    "idna",
    "urllib3",
    "docutils",
    "pygments",
]

[tool.kivy.ios.python]
version = "3.15.0"

[tool.kivy.ios.signing]
team_id = ""
identity = "Apple Development"
provisioning_profile = ""
auto_signing = true
upload_symbols = true
