[project]
# The macOS CI gate's fixture app. Not an example — see ../README.md for why
# this commits its lock when examples/** deliberately does not.
name = "macos-gate"
version = "1.0.0"
requires-python = ">=3.13"
# Kivy on purpose, rather than a dependency-free app. The macOS T3 checks that
# have actually caught defects need third-party wheels to look at: the
# Mach-O-arch sweep walks the whole staged tree, and payload stripping is
# scoped to Contents/Resources/app + Contents/Resources/python's
# site-packages, both empty without dependencies. A no-dependency fixture
# would make the job green while inspecting almost nothing.
dependencies = [
    "kivy>=2.3.1",
]

[tool.kivy]
display_name = "macOS Gate"
app_dir = "src"
entry_point = "main"
orientation = ["portrait"]

[tool.kivy.macos]
schema_version = 1
bundle_id = "org.kivyforge.macos-gate"
build = 1
archs = ["arm64"]
# Kivy declares these unconditionally and nothing in this fixture needs them;
# excluding them keeps the committed lock small enough to read in a diff, which
# is the point of committing it.
exclude = [
    "kivy-garden",
    "requests",
    "certifi",
    "charset-normalizer",
    "idna",
    "urllib3",
    "docutils",
    "pygments",
]

[tool.kivy.macos.python]
# Pinned rather than floating: the T3 .pyc-magic check asks the *staged*
# interpreter what it accepts, so this value is what that assertion is made
# against. Bumping it is a deliberate change to what the gate proves.
version = "3.13.14"

# No [tool.kivy.macos.signing]: the ad-hoc floor applies (macos_package.py),
# so `kivyforge package -p macos` needs no certificate, keychain, or secret to
# produce a `codesign --verify`-clean .app — exactly what a CI runner has
# available and nothing more. See ../README.md and
# docs/design/dev/roadmap.md item 5.
