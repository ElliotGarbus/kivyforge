[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kivyforge"
version = "3.0.0.dev0"
description = "Declarative, PEP 621-aligned build toolchain for Kivy apps — successor to kivy-ios, python-for-android, and buildozer (iOS, Android, macOS, Linux, and Windows)"
license = "MIT"
readme = "README.md"
requires-python = ">=3.13"
authors = [
    { name = "The Kivy Team", email = "kivy-dev@googlegroups.com" },
]
keywords = ["kivy", "ios", "android", "toolchain", "packaging", "mobile", "buildozer"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Build Tools",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
]
dependencies = [
    # CLI verbs
    "click>=8.1",
    # Human-facing rendering (kivyforge/report). Pure Python, no transitive
    # weight. Chosen partly because it derives ASCII box/rule substitution from
    # the stream's own encoding, which is what a redirected cp1252 Windows
    # stream needs -- see docs/design/dev/roadmap.md item 3.
    "rich>=13",
    # PEP 508 / 621 / 503 marker evaluation and version parsing
    "packaging>=24",
    # Xcode project file generation (spec 06)
    "pbxproj>=3.5",
    # TOML writing for pylock.ios.toml; tomllib (reading) is stdlib since 3.11
    "tomli-w>=1.1",
    # Locking and wheel staging run `sys.executable -m pip`, and tool installers
    # (uv tool, pipx) do not guarantee pip in the tool's environment. The floor
    # is the highest resolver floor: MIN_ANDROID_PIP_VERSION (PEP 738 tags);
    # iOS needs >= 24.3 (MIN_PIP_VERSION).
    "pip>=25.1",
    # Icon and splash rendering for Android, Linux and Windows. Required rather
    # than an extra: a configured icon source must not depend on remembering to
    # install one, and it weighs about what pip does. macOS and iOS use the
    # host's sips/iconutil and Xcode instead.
    "Pillow>=10",
]

[project.urls]
Homepage = "https://github.com/ElliotGarbus/kivyforge"
Source = "https://github.com/ElliotGarbus/kivyforge"
"Bug Reports" = "https://github.com/ElliotGarbus/kivyforge/issues"

[project.scripts]
kivyforge = "kivyforge.cli:main"
kf = "kivyforge.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.9",
    # Type checking; configured in pyrightconfig.json. The pip package downloads
    # a Node runtime on first run, which is why it is a dev extra rather than a
    # runtime one.
    "pyright>=1.1.400",
]
# End-user documentation site (MkDocs Material -> GitHub Pages; roadmap item 6).
# Installing this extra also installs kivyforge itself, which both mkdocs-click
# (for the generated CLI reference) and docs/hooks/kf_generated.py import.
docs = [
    "mkdocs-material>=9.5",
    "mkdocs-click>=0.8",
]

# ---------------------------------------------------------------------------
# Setuptools package discovery
# ---------------------------------------------------------------------------
[tool.setuptools.packages.find]
where = ["."]
include = ["kivyforge*"]

[tool.setuptools.package-data]
"*" = ["*.md", "*.txt", "*.toml", "*.h", "*.m", "*.h.in"]
# Windows backend: the vendored prebuilt launcher + rcedit (with their SHA-256
# manifest and licenses/notice) and the launcher's in-repo C source.
"kivyforge.platforms.windows.vendor" = [
    "*.exe",
    "SHA256SUMS",
    "LICENSE.rcedit",
    "NOTICE",
]
"kivyforge.platforms.windows.launcher" = ["*.c"]
# Android backend: the bootstrap templates (proven-prototype Java/C sources,
# the finder .py, and the vendored stock SDL Java glue + its license).
"kivyforge.platforms.android.bootstrap" = [
    "templates/**/*.java",
    "templates/**/*.c",
    "templates/**/*.txt",
    "templates/**/*.py",
    "templates/**/CMakeLists.txt",
    "templates/androidtest/**/*.java",
    # Code vendored from python-for-android, with its license and pin.
    "templates/p4a/LICENSE",
    "templates/p4a/NOTICE",
    "templates/p4a/P4A_VENDOR.toml",
    "templates/p4a/**/*.java.in",
]
# Android backend: the vendored stock Gradle wrapper (Apache-2.0; see NOTICE).
"kivyforge.platforms.android" = [
    "gradle_wrapper/gradle-wrapper.jar",
    "gradle_wrapper/gradlew",
    "gradle_wrapper/gradlew.bat",
    "gradle_wrapper/SHA256SUMS",
    "gradle_wrapper/NOTICE",
]

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short -q --cov=kivyforge --cov-config=pyproject.toml --cov-report=term-missing --cov-fail-under=80"

# ---------------------------------------------------------------------------
# coverage
# ---------------------------------------------------------------------------
[tool.coverage.run]
source = ["kivyforge"]
branch = true
# Templates are app-runtime files placed in the built bundle, not library
# code exercised by the test suite.
omit = [
    "kivyforge/platforms/ios/templates/*",
    # Windows launcher/rcedit build+fetch tooling: needs the MSVC toolset /
    # network, so it is exercised by the dedicated windows_launcher CI job
    # rather than the hermetic unit suite. Leading-* matches both the Linux
    # (forward-slash) and Windows (backslash) recorded paths.
    "*build_launcher.py",
    "*fetch_rcedit.py",
]

[tool.coverage.report]
# Lines pragma-excluded from coverage counts.
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "\\.\\.\\.",          # Protocol stubs
    "raise NotImplementedError",
]

# ---------------------------------------------------------------------------
# ruff (replaces flake8 + isort)
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py313"
line-length = 88
# Generated Gradle projects stage the runtime's stdlib + app bundle; never lint
# them (they are regenerated artifacts, git-ignored). Code vendored from
# python-for-android is kept identical to upstream, so it is not ours to restyle.
extend-exclude = [
    "*-android",
    "*-ios",
    "kivyforge/platforms/android/bootstrap/templates/p4a",
]
[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long — handled by formatter
]
