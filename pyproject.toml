[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kivyforge"
version = "3.0.0.dev0"
description = "Declarative, PEP 621-aligned build toolchain for Kivy apps — successor to kivy-ios, python-for-android, and buildozer (iOS, macOS, Linux, and Windows today; Android planned)"
license = "MIT"
readme = "README.md"
requires-python = ">=3.13"
authors = [
    { name = "The Kivy Team", email = "kivy-dev@googlegroups.com" },
]
keywords = ["kivy", "ios", "android", "toolchain", "packaging", "mobile", "buildozer"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Build Tools",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
]
dependencies = [
    # CLI verbs
    "click>=8.1",
    # PEP 508 / 621 / 503 marker evaluation and version parsing
    "packaging>=24",
    # Xcode project file generation (spec 06)
    "pbxproj>=3.5",
    # TOML writing for pylock.ios.toml; tomllib (reading) is stdlib since 3.11
    "tomli-w>=1.1",
]

[project.urls]
Homepage = "https://github.com/ElliotGarbus/kivyforge"
Source = "https://github.com/ElliotGarbus/kivyforge"
"Bug Reports" = "https://github.com/ElliotGarbus/kivyforge/issues"

[project.scripts]
kivyforge = "kivyforge.cli:main"
kf = "kivyforge.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.9",
    "Pillow>=10",
]
# Linux backend icon resizing (hicolor size set + AppImage root icon). Pillow is
# pure-manylinux and ubiquitous; kept optional so the core install stays lean.
linux = [
    "Pillow>=10",
]
# Windows backend icon rendering (1024×1024 PNG → multi-size .ico). Same opt-in
# Pillow dependency as the Linux icons extra; kept optional to stay lean.
windows = [
    "Pillow>=10",
]

# ---------------------------------------------------------------------------
# Setuptools package discovery
# ---------------------------------------------------------------------------
[tool.setuptools.packages.find]
where = ["."]
include = ["kivyforge*"]

[tool.setuptools.package-data]
"*" = ["*.md", "*.txt", "*.toml", "*.h", "*.m", "*.h.in"]
# Windows backend: the vendored prebuilt launcher + rcedit (with their SHA-256
# manifest and licenses/notice) and the launcher's in-repo C source.
"kivyforge.platforms.windows.vendor" = [
    "*.exe",
    "SHA256SUMS",
    "LICENSE.rcedit",
    "NOTICE",
]
"kivyforge.platforms.windows.launcher" = ["*.c"]

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short -q --cov=kivyforge --cov-config=pyproject.toml --cov-report=term-missing --cov-fail-under=80"

# ---------------------------------------------------------------------------
# coverage
# ---------------------------------------------------------------------------
[tool.coverage.run]
source = ["kivyforge"]
branch = true
# Templates are app-runtime files placed in the built bundle, not library
# code exercised by the test suite.
omit = [
    "kivyforge/platforms/ios/templates/*",
    # Windows launcher/rcedit build+fetch tooling: needs the MSVC toolset /
    # network, so it is exercised by the dedicated windows_launcher CI job
    # rather than the hermetic unit suite. Leading-* matches both the Linux
    # (forward-slash) and Windows (backslash) recorded paths.
    "*build_launcher.py",
    "*fetch_rcedit.py",
]

[tool.coverage.report]
# Lines pragma-excluded from coverage counts.
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "\\.\\.\\.",          # Protocol stubs
    "raise NotImplementedError",
]

# ---------------------------------------------------------------------------
# ruff (replaces flake8 + isort)
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py313"
line-length = 88
[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long — handled by formatter
]
