# The hardware pass: every check CI cannot run, with the exact commands and
# what counts as a pass (roadmap item 5, "the manual checklist becomes
# runnable"; test-matrix.md section 6).
#
# Driven by scripts/hardware_pass.py:
#   python scripts/hardware_pass.py list            # what applies to this host
#   python scripts/hardware_pass.py show <id>        # commands + pass criteria
#   python scripts/hardware_pass.py record <id> --result pass --device "..."
# `record` appends a dated row to test-matrix.md section 7, because an
# unlogged manual test did not happen.
#
# Fields:
#   id        stable key; the test-matrix section 6 list names every one
#   title     one line
#   status    runnable          - can be run with hardware we have
#             needs-credentials - needs an account or certificate the owner
#                                 does not hold (steps kept for whoever does)
#             blocked           - waits on something external; `blocked_on`
#             no-hardware       - needs hardware we do not have
#   hosts     where the commands run: windows, macos, linux (WSL2 counts as
#             linux; record says which)
#   target    the test-matrix section 7 "Target" column
#   tier      the section 7 "Tier" column
#   needs     hardware, accounts and setup, in order
#   commands  run in order from the repo root unless a command says otherwise
#   pass      what must be observed; every line must hold for a pass
#   record    optional: what else to write into the note (recorded, not
#             required)
#   previous  where the last manual result lives, if one predates this file

schema_version = 1

[[item]]
id = "android-device"
title = "Android: contract smoke test and launch on a physical arm64 phone"
status = "runnable"
hosts = ["windows", "macos", "linux"]
target = "Android `arm64_v8a` (physical device)"
tier = "T4 + T5"
needs = [
    "An arm64 Android phone with USB debugging on, authorized for this host (`adb devices` shows `device`, not `unauthorized`).",
    "The phone unlocked with the screen on and no notification shade open: a locked screen or raised shade holds focus and SDL never gets a surface.",
    "JDK 17, Android SDK and the pinned NDK: `kivyforge doctor -p android` passes.",
]
commands = [
    "cd examples/mobile/hello-android",
    "kivyforge doctor -p android",
    "kivyforge run -p android --device --smoke --release",
    "kivyforge run -p android --device",
]
pass = [
    "`run --device --smoke --release` prints exactly `Contract smoke test PASSED.` on stdout and exits 0.",
    "Plain `run --device` shows the app on the phone, and the logcat it prints includes Kivy's `Start application main loop`.",
]
record = ["Phone model and Android version.", "Host OS (the item runs from any host)."]
previous = "test-matrix section 7: 2026-09-27 (Pixel 8a, macOS host), 2026-09-13 (Pixel 8a, T5)"

[[item]]
id = "ios-device"
title = "iOS: build, sign, install and launch on a physical iPhone"
status = "runnable"
hosts = ["macos"]
target = "iOS device `arm64`"
tier = "T4 + T5"
needs = [
    "An iPhone paired with this Mac and listed by `xcrun devicectl list devices`.",
    "An Apple ID signed into Xcode whose team is passed in `KIVYFORGE_TEAM_ID` (the example commits `team_id = \"\"`; do not edit it).",
    "The phone unlocked when the app launches.",
]
commands = [
    "cd examples",
    "./verify-ios-device.sh hello-kivy",
]
pass = [
    "The script's build, launch and package steps succeed for `hello-kivy`. The run step fails only if the app never launched; after a launch its exit status is printed, not counted: closing the app from the app switcher often ends it with signal 9, which `devicectl` reports as exit 1.",
    "The app opens on the phone and shows its label; the console streams Kivy's log, including `Start application main loop`.",
]
record = ["iPhone model and iOS version.", "Xcode version."]
previous = "test-matrix section 7: 2026-09-27 (PR #20 validation), 2026-09-14 (first device run)"

[[item]]
id = "ios-strip-source"
title = "iOS: a byte-compiled, source-stripped release build runs on device"
status = "blocked"
blocked_on = "CPython 3.15.0 final and python.org's iOS Python.xcframework for it. Every iOS example pins 3.15.0b4, and `package -p ios` only byte-compiles with a final CPython (handoff-2026-09-25.md, task 3)."
hosts = ["macos"]
target = "iOS device `arm64`"
tier = "T3 + T5"
needs = [
    "A final CPython 3.15 on the Mac and its iOS xcframework on python.org.",
    "An example re-pinned to it (`hello-kivy` tracks its lock: diff and report a changed lock, do not commit it).",
]
commands = [
    "cd examples/mobile/hello-kivy",
    "kivyforge package -p ios",
    "kivyforge run -p ios --device",
]
pass = [
    "`package` byte-compiles instead of printing `no final CPython 3.15 found`.",
    "The app launches on the phone from the stripped build.",
]

[[item]]
id = "macos-notarize"
title = "macOS: Developer ID signing, notarization and stapling"
status = "runnable"
hosts = ["macos"]
target = "macOS `arm64` (`dice-roller`)"
tier = "T5 (signing)"
needs = [
    "A `Developer ID Application` certificate in the login keychain.",
    "A notarytool keychain profile (`xcrun notarytool store-credentials <profile>`).",
]
commands = [
    "cd examples/desktop/dice-roller",
    "kivyforge package -p macos --signing-identity \"Developer ID Application: <name> (<team>)\" --notarize --notary-profile <profile>",
    "spctl -a -vvv -t exec build/macos/*.app",
    "xcrun stapler validate build/macos/*.app",
]
pass = [
    "`package` reports the notarization accepted and the ticket stapled.",
    "`spctl` reports `accepted` with `source=Notarized Developer ID`.",
    "`stapler validate` reports `The validate action worked!`.",
]
previous = "test-matrix section 7: 2026-09-14 (notarytool history: five Accepted submissions since 2026-07-07)"

[[item]]
id = "windows-authenticode"
title = "Windows: Authenticode with a publicly trusted certificate"
status = "needs-credentials"
hosts = ["windows"]
target = "Windows `amd64` (`dice-roller`)"
tier = "T5 (signing)"
needs = [
    "A publicly trusted code-signing certificate whose key is on a hardware token, or in a cloud key service that installs the certificate into the Windows store (for example DigiCert KeyLocker or SSL.com eSigner). Azure Artifact Signing is not supported (signing-windows.md).",
    "`signtool.exe` on PATH (Windows SDK).",
    "`[tool.kivy.windows.signing].thumbprint` set to the certificate's SHA-1 thumbprint.",
]
commands = [
    "cd examples/desktop/dice-roller",
    "kivyforge doctor -p windows",
    "kivyforge package -p windows",
    "signtool verify /pa /v \"dist\\windows\\<bundle>\\<App>.exe\"",
    "powershell -Command \"Get-AuthenticodeSignature 'dist\\windows\\<bundle>\\<App>.exe' | Format-List Status,SignerCertificate,TimeStamperCertificate\"",
]
pass = [
    "`doctor` passes the certificate checks.",
    "`signtool verify /pa` succeeds and shows a timestamp.",
    "`Get-AuthenticodeSignature` reports `Status: Valid`, the signer is the certificate's subject, and a timestamper certificate is present.",
]
record = ["What SmartScreen shows when the zipped bundle is downloaded through a browser on another machine. A new certificate may still warn until reputation builds, so this is recorded, not required."]

[[item]]
