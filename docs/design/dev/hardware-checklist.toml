[[item]]
id = "pi5-appimage"
title = "Raspberry Pi 5: an aarch64 AppImage cross-built on x86_64 runs on the Pi"
status = "runnable"
hosts = ["linux"]
target = "Linux `aarch64` (Raspberry Pi 5)"
tier = "T2 + T5"
needs = [
    "An x86_64 Linux build host (WSL2 works, on the Linux filesystem).",
    "A Raspberry Pi 5 with a desktop session, reachable by scp.",
    "`examples/desktop/dice-roller` temporarily set to `[tool.kivy.linux].archs = [\"aarch64\"]`. Do not commit that edit.",
]
commands = [
    "cd examples/desktop/dice-roller",
    "kivyforge lock -p linux",
    "kivyforge package -p linux --arch aarch64",
    "scp dist/linux/dice-roller-*-aarch64.AppImage <user>@<pi>:~/",
    "On the Pi, in its desktop session: ~/dice-roller-*-aarch64.AppImage",
]
pass = [
    "The AppImage starts on the Pi and the Dice Roller window renders on its display.",
]
record = ["Pi model and revision, OS, compositor (for example labwc), display output."]
previous = "aarch64-pi-target-findings.md; test-matrix section 7, 2026-09-17"

