status = "runnable"
hosts = ["windows"]
target = "Windows `amd64` (`dice-roller`)"
tier = "T5 (interactive)"
needs = ["An interactive desktop session (not SSH or a service)."]
commands = [
    "cd examples/desktop/dice-roller",
    "kivyforge package -p windows",
    "Double-click the launcher in `dist\\windows\\<bundle>\\` in Explorer.",
    "Create a shortcut (.lnk) to the launcher on the desktop and start the app from it.",
    "kivyforge run -p windows, then press Ctrl+C in that terminal.",
]
pass = [
    "Double-click: the app window opens and no console window appears, not even briefly.",
    "Shortcut: the app opens the same way.",
    "Ctrl+C: the app closes and the terminal gets its prompt back; no python.exe is left running (Task Manager).",
]
record = ["Paths longer than MAX_PATH are covered in CI since 2026-09-24 (test-matrix section 5.6) and need no manual check."]

