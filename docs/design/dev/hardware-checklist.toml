    "`doctor` passes the certificate checks.",
    "`signtool verify /pa` succeeds and shows a timestamp.",
    "`Get-AuthenticodeSignature` reports `Status: Valid`, the signer is the certificate's subject, and a timestamper certificate is present.",
]
record = ["What SmartScreen shows when the zipped bundle is downloaded through a browser on another machine. A new certificate may still warn until reputation builds, so this is recorded, not required."]

