# The hardware pass: every check CI cannot run, with the exact commands and
# what counts as a pass (roadmap item 5, "the manual checklist becomes
# runnable"; test-matrix.md section 6).
#
# Driven by scripts/hardware_pass.py:
#   python scripts/hardware_pass.py list            # what applies to this host
#   python scripts/hardware_pass.py show <id>        # commands + pass criteria
#   python scripts/hardware_pass.py record <id> --result pass --device "..."
# `record` appends a dated row to test-matrix.md section 7, because an
# unlogged manual test did not happen.
#
# Fields:
#   id        stable key; the test-matrix section 6 list names every one
#   title     one line
#   status    runnable          - can be run with hardware we have
#             needs-credentials - needs an account or certificate the owner
#                                 does not hold (steps kept for whoever does)
#             blocked           - waits on something external; `blocked_on`
#             no-hardware       - needs hardware we do not have
#   hosts     where the commands run: windows, macos, linux (WSL2 counts as
#             linux; record says which)
#   target    the test-matrix section 7 "Target" column
#   tier      the section 7 "Tier" column
#   needs     hardware, accounts and setup, in order
#   commands  run in order from the repo root unless a command says otherwise
#   pass      what must be observed; every line must hold for a pass
#   record    optional: what else to write into the note (recorded, not
#             required)
#   previous  where the last manual result lives, if one predates this file

schema_version = 1

[[item]]
id = "android-device"
title = "Android: contract smoke test and launch on a physical arm64 phone"
status = "runnable"
hosts = ["windows", "macos", "linux"]
target = "Android `arm64_v8a` (physical device)"
tier = "T4 + T5"
needs = [
    "An arm64 Android phone with USB debugging on, authorized for this host (`adb devices` shows `device`, not `unauthorized`).",
    "The phone unlocked with the screen on and no notification shade open: a locked screen or raised shade holds focus and SDL never gets a surface.",
    "JDK 17, Android SDK and the pinned NDK: `kivyforge doctor -p android` passes.",
]
commands = [
    "cd examples/mobile/hello-android",
    "kivyforge doctor -p android",
    "kivyforge run -p android --device --smoke --release",
    "kivyforge run -p android --device --no-follow",
]
pass = [
    "`run --device --smoke --release` prints exactly `Contract smoke test PASSED.` on stdout and exits 0.",
    "Plain `run --device` shows the app on the phone, and the logcat it prints includes Kivy's `Start application main loop`.",
]
record = ["Phone model and Android version.", "Host OS (the item runs from any host)."]
previous = "test-matrix section 7: 2026-09-27 (Pixel 8a, macOS host), 2026-09-13 (Pixel 8a, T5)"

