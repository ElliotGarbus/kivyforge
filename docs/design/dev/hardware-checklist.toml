[[item]]
id = "ios-strip-source"
title = "iOS: a byte-compiled, source-stripped release build runs on device"
status = "runnable"
hosts = ["macos"]
target = "iOS device `arm64`"
tier = "T3 + T5"
needs = [
    "A final CPython 3.15 on the Mac's PATH as `python3.15` (`uv python install 3.15.0` works); `package` byte-compiles with it.",
    "An iPhone paired with this Mac and listed by `xcrun devicectl list devices`, unlocked.",
    "An Apple ID signed into Xcode whose team is passed with `--team-id`.",
    "`hello-kivy` pinned to a final 3.15 (`[tool.kivy.ios.python].version`). It tracks its lock: diff and report a changed lock, do not commit it.",
]
# `run -p ios --device` is not the launch step: it does a fresh dev build, whose
# app/ is a symlink to src/ and whose payload is source. The stripped build is
# only the .ipa, so the .ipa is what gets installed.
commands = [
    "cd examples/mobile/hello-kivy",
    "kivyforge package -p ios --team-id <your team> --export-method development",
    "mkdir -p /tmp/kf-ipa && unzip -oq dist/ios/hello-kivy-0.1.0-development.ipa -d /tmp/kf-ipa",
    "cd ../../.. && pytest tests/platforms/ios/test_app_artifact.py -v --no-cov --ios-app /tmp/kf-ipa/Payload/hello-kivy.app --ios-stripped --ios-project examples/mobile/hello-kivy",
    "xcrun devicectl device install app --device <udid> examples/mobile/hello-kivy/dist/ios/hello-kivy-0.1.0-development.ipa",
    "xcrun devicectl device process launch --terminate-existing --device <udid> org.kivy.hello-kivy",
    "xcrun devicectl device copy from --device <udid> --domain-type appDataContainer --domain-identifier org.kivy.hello-kivy --source Documents/.kivy/logs/kivy_<yy-mm-dd>_<n>.txt --destination kivy.txt",
]
pass = [
    "`package` prints `byte-compiling app sources with python3.15` and `byte-compiling pip-deps with python3.15`, not `no final CPython 3.15 found`.",
    "The stripped T3 driver passes: no `.py` and no `__pycache__` in `app/` or `pip-deps/`, and every `.pyc` there carries the magic of the stdlib's own bytecode.",
    "The app launches on the phone, and its Kivy log shows Kivy imported from `pip-deps/kivy/__init__.pyc` and `Base: Start application main loop`.",
]
record = ["iPhone model and iOS version.", "CPython and Kivy versions from the Kivy log."]

