name: kivyforge

on:
  push:
  pull_request:
  # Manual re-vendor of the Windows launcher when the runner's MSVC toolset drifts
  # (see the revendor_launcher job).
  workflow_dispatch:

jobs:
  lint:
    name: Lint (ruff + pyright)
    runs-on: ubuntu-latest
    steps:
    - name: Checkout kivyforge
      uses: actions/checkout@v6
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.x'
    - name: Install dev dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"
    - name: ruff check
      run: ruff check kivyforge tests
    - name: ruff format --check
      run: ruff format --check kivyforge tests
    # Scope and settings live in pyrightconfig.json, including
    # pythonPlatform: All -- without it this ubuntu job would fail on the
    # Windows-only registry probe that Windows hosts analyse cleanly.
    - name: pyright
      run: pyright

  # The Android bootstrap vendors SDL's Java glue paired with the libSDL*.so
  # the kivy-mobile-wheels repo ships (android/05 §matched pair;
  # kivyforge/platforms/android/bootstrap/contract.py). check_sdl_glue_contract
  # catches a version-stamp mismatch at build time, but only after the fact;
  # this job catches the two repos' vendored copies silently diverging in
  # *content* the moment either one changes.
  sdl_glue_sync:
    name: SDL glue sync (kivy-mobile-wheels)
    runs-on: ubuntu-latest
    steps:
    - name: Checkout kivyforge
      uses: actions/checkout@v6
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.x'
    - name: Verify vendored SDL glue matches kivy-mobile-wheels
      run: python scripts/check_sdl_glue_sync.py

  package:
    name: Package (build + twine)
    runs-on: ubuntu-latest
    steps:
    - name: Checkout kivyforge
      uses: actions/checkout@v6
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.x'
    - name: Install build tooling
      run: |
        python -m pip install --upgrade pip build twine
    - name: Build sdist and wheel
      run: python -m build
    - name: Twine check
      run: twine check dist/*

  unit_tests:
    name: Unit tests (Ubuntu)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.13', '3.14']
    steps:
    - name: Checkout kivyforge
      uses: actions/checkout@v6
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install kivyforge and test dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"
    - name: Run pytest with coverage
      run: |
        pytest --cov=kivyforge --cov-report=term-missing --cov-report=xml

  windows_tests:
    name: Unit tests (Windows)
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ['3.13', '3.14']
    steps:
    - name: Checkout kivyforge
      uses: actions/checkout@v6
    - name: Enable Windows symlink creation (Developer Mode)
      # git config core.symlinks does NOT grant the OS privilege that os.symlink
      # needs; without it the requires_symlinks tests self-skip. Enabling
      # Developer Mode grants SeCreateSymbolicLinkPrivilege to non-elevated
      # processes, so the pytest step below (a fresh process) can create symlinks.
      run: reg add "HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock" /t REG_DWORD /f /v "AllowDevelopmentWithoutDevLicense" /d "1"
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install kivyforge and test dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"
    - name: Run pytest with coverage
      # KIVYFORGE_REQUIRE_SYMLINKS makes the suite fail loudly if the symlink
      # privilege is missing, so requires_symlinks tests can never silently skip
      # in CI (see tests/conftest.py).
      env:
        KIVYFORGE_REQUIRE_SYMLINKS: '1'
      run: pytest --cov=kivyforge --cov-report=term-missing --cov-report=xml

  windows_launcher:
    name: Launcher reproducibility + vendored assets (Windows)
    # arm64: this job (and revendor_launcher below) build/verify only
    # launcher-amd64.exe. Adding win_arm64 means also building/verifying
    # launcher-arm64.exe — cross-compile on this same x64 runner via
    # `vcvarsall x64_arm64` (add the VC.Tools.ARM64 component), or add an arm64
    # runner; a build-arch matrix is the natural shape. See arm64-windows.md §10.
    # Skipped on manual re-vendor runs: this job would only fail on the stale
    # vendored files it checked out before its sibling committed. The equivalent
    # gate for those runs is revendor_verify, which runs these same steps on a
    # fresh runner against the commit revendor_launcher just pushed.
    if: github.event_name != 'workflow_dispatch'
    runs-on: windows-latest
    steps:
    - name: Checkout kivyforge
      uses: actions/checkout@v6
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.x'
    - name: Install kivyforge
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"
    - name: Verify vendored rcedit matches its pinned SHA-256
      run: python -m kivyforge.platforms.windows.vendor.fetch_rcedit --check
    - name: Rebuild the launcher from source and byte-compare (reproducibility)
      # Cross-runner byte-identity comes from the linker's
      # /EMITTOOLVERSIONINFO:NO (no PE "rich header", so the serviced cl/link
      # build is not stamped into the image — VCTOOLSVERSION does NOT pin that;
      # see build_launcher.py's docstring). The TOOLSET.txt pin (e.g. 14.51.36231
      # / 10.0.26100.0, loaded via vcvarsall — not "latest") holds code
      # generation steady on top of it. If this fails with "cl not found" / a
      # vcvars error the runner image dropped that exact pair; if it fails with a
      # byte mismatch the C source or the compile/link flags changed without
      # re-vendoring. Either way: Actions → Run workflow (`revendor_launcher`)
      # to re-pin against the runner's current defaults.
      run: python -m kivyforge.platforms.windows.launcher.build_launcher verify
    - name: Exercise the launcher end-to-end (spawn/argv/exit-code/env)
      # These tests self-skip without MSVC, which on this job would be a green run
      # that tested nothing — the same failure mode KIVYFORGE_REQUIRE_SYMLINKS
      # exists for. This runner has MSVC, so say so and let a missing one fail.
      env:
        KIVYFORGE_REQUIRE_TOOLCHAIN: '1'
      run: pytest tests/platforms/windows/test_launcher_exe.py -v --no-cov

  revendor_launcher:
    name: Re-vendor launcher (manual, on toolset drift)
    # Manual-only: run from the Actions tab when windows_launcher fails because the
    # runner image dropped the pinned MSVC toolset. Rebuilds the launcher with the
    # runner's current (in-support) toolset, self-checks reproducibility, and
    # commits the refreshed binary + SHA256SUMS + TOOLSET.txt back to the branch.
    # The self-check here is same-runner only; revendor_verify is the real gate.
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    permissions:
      contents: write
    outputs:
      # The commit revendor_verify must check out — the one this job pushed, or
      # the checked-out commit when the launcher was already up to date.
      sha: ${{ steps.commit.outputs.sha }}
    steps:
    - name: Checkout kivyforge
      uses: actions/checkout@v6
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.x'
    - name: Install kivyforge
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"
    - name: Rebuild the launcher with the runner's current MSVC toolset
      shell: pwsh
      run: |
        # Drop the stale pin so build_launcher resolves the runner's default
        # (current, in-support) MSVC + Windows SDK and records both in
        # TOOLSET.txt.
        Remove-Item kivyforge\platforms\windows\vendor\TOOLSET.txt -ErrorAction SilentlyContinue
        python -m kivyforge.platforms.windows.launcher.build_launcher build
    - name: Verify the re-vendored launcher is reproducible on this runner
      # Same-machine check only — it catches a broken build before committing,
      # but proves nothing about cross-runner drift (the failure mode that
      # /EMITTOOLVERSIONINFO:NO exists to kill). revendor_verify does that.
      run: python -m kivyforge.platforms.windows.launcher.build_launcher verify
    - name: Commit and push the re-vendored launcher (if changed)
      id: commit
      shell: bash
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add kivyforge/platforms/windows/vendor/launcher-amd64.exe \
                kivyforge/platforms/windows/vendor/SHA256SUMS \
                kivyforge/platforms/windows/vendor/TOOLSET.txt
        if git diff --cached --quiet; then
          echo "Launcher already reproducible with the current toolset; nothing to commit."
        else
          # TOOLSET.txt is multi-line (MSVC + Windows SDK); flatten for the subject.
          toolset="$(grep -v '^#' kivyforge/platforms/windows/vendor/TOOLSET.txt | tr '\n' ' ' | sed 's/[[:space:]]*$//')"
          git commit -m "chore(windows): re-vendor launcher for ${toolset}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
        fi
        echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
    - name: Upload re-vendored launcher assets (fallback if push is blocked)
      uses: actions/upload-artifact@v6
      with:
        name: vendored-launcher
        path: |
          kivyforge/platforms/windows/vendor/launcher-amd64.exe
          kivyforge/platforms/windows/vendor/SHA256SUMS
          kivyforge/platforms/windows/vendor/TOOLSET.txt

  revendor_verify:
    name: Verify the re-vendored launcher (fresh runner)
    # revendor_launcher pushes with the default GITHUB_TOKEN, and GitHub does not
    # start new workflow runs from those pushes (recursion guard) — so a re-vendor
    # commit lands with its reproducibility gate never having run, until someone
    # notices and pushes an empty commit. This job closes that hole: a separate
    # job means a **different runner VM**, which is exactly the cross-machine
    # comparison the gate is for (the same-job check above cannot see that drift).
    needs: revendor_launcher
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
    - name: Checkout the re-vendored commit
      uses: actions/checkout@v6
      with:
        # The commit revendor_launcher pushed, not the one that triggered this
        # run. If the push was blocked this ref will not exist on the remote and
        # this job fails loudly — grab the `vendored-launcher` artifact instead.
        ref: ${{ needs.revendor_launcher.outputs.sha }}
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.x'
    - name: Install kivyforge
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"
    - name: Rebuild the launcher from source and byte-compare (reproducibility)
      run: python -m kivyforge.platforms.windows.launcher.build_launcher verify
    - name: Exercise the launcher end-to-end (spawn/argv/exit-code/env)
      # The re-vendored binary is what ships; prove it runs, not just that its
      # bytes reproduce. Nothing else exercises it on a workflow_dispatch run.
      env:
        KIVYFORGE_REQUIRE_TOOLCHAIN: '1'
      run: pytest tests/platforms/windows/test_launcher_exe.py -v --no-cov

  windows_signing:
    name: Authenticode sign + verify (self-signed, Windows)
    runs-on: windows-latest
    steps:
    - name: Checkout kivyforge
      uses: actions/checkout@v6
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.x'
    - name: Install kivyforge
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"
    - name: Self-signed sign -> verify loop through SigntoolSigner
      shell: pwsh
      run: |
        # Put the Windows SDK's signtool on PATH so shutil.which() finds it
        # (this is exactly what SigntoolSigner.sign resolves at runtime).
        $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" |
          Sort-Object FullName -Descending | Select-Object -First 1
        if (-not $signtool) { throw "signtool.exe not found in the Windows SDK" }
        $env:PATH = "$($signtool.Directory);$env:PATH"

        # A code-signing cert in CurrentUser\My (the store SigntoolSigner uses
        # without /sm); trust its public cert so `signtool verify /pa` passes.
        $cert = New-SelfSignedCertificate -Type CodeSigningCert `
          -Subject "CN=kivyforge CI" -CertStoreLocation Cert:\CurrentUser\My
        $tp = $cert.Thumbprint
        Export-Certificate -Cert $cert -FilePath ci.cer | Out-Null
        Import-Certificate -FilePath ci.cer -CertStoreLocation Cert:\LocalMachine\Root | Out-Null

        # Sign a copy of the vendored launcher via our own SigntoolSigner, then
        # verify the resulting Authenticode signature + timestamp.
        #
        # The verification goes through tests/platforms/windows/
        # test_authenticode.py rather than a bare `signtool verify /pa`, which
        # checked only the exit code. The driver asserts the verification
        # counts and the RFC3161 timestamp as well, and running it here is what
        # puts the report parser itself under CI — no job builds a Windows
        # bundle yet, so this is the only place that exercises it
        # (test-matrix.md §5.1, §5.3).
        Copy-Item kivyforge\platforms\windows\vendor\launcher-amd64.exe signed.exe
        python -c "from pathlib import Path; from kivyforge.platforms.windows.signing import SigntoolSigner; SigntoolSigner('$tp', 'http://timestamp.digicert.com', 'current_user').sign([Path('signed.exe')])"
        $env:KIVYFORGE_REQUIRE_TOOLCHAIN = '1'
        pytest tests/platforms/windows/test_authenticode.py -q --no-cov `
          --windows-signed-exe signed.exe

  # The Linux desktop gate: `kivyforge package -p linux` end to end against a
  # real appimagetool, then the T3 artifact pass over what it produced. Until
  # this job existed, no CI job ran `kivyforge build` or `package` for ANY
  # desktop target — Linux, macOS and Windows were all proven by local runs
  # logged in test-matrix.md §7 and nothing that repeats (§3.2).
  #
  # It builds a fixture, not an example. tests/fixtures/apps/linux-gate commits
  # its pylock.linux.toml, which examples/** deliberately never does; the
  # reasoning is in that tree's README and in test-matrix.md §5.3. The short
  # version: a gate needs the same inputs every run, so that red means
  # kivyforge changed rather than PyPI did.
  linux_appimage:
    name: Linux AppImage (package + T3)
    runs-on: ubuntu-latest
    env:
      APP_DIR: tests/fixtures/apps/linux-gate
    steps:
    - name: Checkout kivyforge
      uses: actions/checkout@v6
    - name: Set up Python 3.13
      # Pinned, per test-matrix.md §5.8: this is the sole CI proof of Linux, so
      # it must not test whichever minor the runner image happens to ship.
      #
      # Not pinned for the .pyc-magic check, which is a different mechanism
      # here than on Android: the Linux T3 driver asks the artifact's OWN
      # staged interpreter what magic it accepts (a native x86_64 build stages
      # an executable one), so that assertion is anchored to the bundle rather
      # than to this runner.
      uses: actions/setup-python@v6
      with:
        python-version: '3.13'
    - name: Install kivyforge
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"
    - name: Doctor (Linux)
      # Gating, deliberately — no `continue-on-error` here. The reason
      # android_gradle waives its doctor step (a known-interim Kivy wheel it
      # reports as FAIL, test-matrix.md §5.9) has no Linux equivalent, and a
      # headless runner only costs a WARN: `check_display_session` returns
      # WARN, not FAIL, when DISPLAY and WAYLAND_DISPLAY are both unset, and
      # doctor's exit code reacts only to FAIL. Verified by running it with
      # both variables unset.
      working-directory: ${{ env.APP_DIR }}
      run: kivyforge doctor -p linux
    - name: Verify the committed lock still matches pyproject.toml
      # `lock --check` is meaningful here precisely because the lock is
      # committed — against a gitignored one it can only ever report "out of
      # date" (03-lockfile-concept.md §"Example-repo lock policy"). Nothing
      # else in CI exercises this verb against a real lock.
      working-directory: ${{ env.APP_DIR }}
      run: kivyforge lock -p linux --check
    - name: Package the AppImage (T2)
      # No --update: the committed lock is the input. If this step starts
      # failing without the fixture having changed, a pinned wheel or the PBS
      # runtime moved at its URL, which is worth knowing loudly.
      working-directory: ${{ env.APP_DIR }}
      run: kivyforge package -p linux
    - name: Assert the AppImage is the artifact the build promised (T3)
      # strip_source and byte_compile both default to "release" and `package`
      # is the only Linux verb that reaches them, so --linux-stripped is
      # correct here and would be wrong for a `build`. This is the pass that
      # caught the shipped AppRun defect in test-matrix.md §7.
      env:
        KIVYFORGE_REQUIRE_TOOLCHAIN: '1'
      run: |
        image="$(ls "$APP_DIR"/dist/linux/*.AppImage)"
        pytest tests/platforms/linux/test_appimage_artifact.py -q --no-cov \
          --linux-appimage "$image" --linux-arch x86_64 --linux-stripped
    - name: Upload the AppDir listing on failure (for triage)
      if: failure()
      uses: actions/upload-artifact@v6
      with:
        name: linux-gate-appdir-listing
        # The AppDir itself is ~120 MB and mostly the embedded runtime; a file
        # listing plus the generated launcher answers every question triage
        # actually asks of it.
        path: |
          ${{ env.APP_DIR }}/build/linux/*.AppDir/AppRun
          ${{ env.APP_DIR }}/build/linux/*.AppDir/*.desktop

  # The Android gate that unit tests structurally cannot be: every generated
  # Gradle/CMake/Java/XML file is only a *string* until AGP, AAPT, the NDK, and
  # javac actually consume it. This job builds a real app end to end from its
  # committed lock — debug APK, then the release policy path (lintRelease + the
  # merged-manifest export) against a throwaway keystore. No emulator: nothing
  # here runs on-device, so the instrumented contract smoke test (android/06
  # `run --smoke`) is still a local/manual gate.
  android_gradle:
    name: Android build (Gradle, no emulator)
    runs-on: ubuntu-latest
    env:
      # The example this gate builds; its pylock.android.toml is committed, so
      # the job needs no Gradle-at-lock-time and no resolver network beyond
      # fetching the pinned artifacts.
      APP_DIR: examples/mobile/hello-android
      # One ABI is enough to compile the launcher and prove the load model; both
      # would double the CMake work for no new signal.
      ABI: x86_64
    steps:
    - name: Checkout kivyforge
      uses: actions/checkout@v6
    - name: Set up Python 3.14
      # Must match [tool.kivy.android.python].version's minor: byte_compile
      # ("release" by default) only writes .pyc when an interpreter with the
      # target's magic number is available, and warns + ships source otherwise.
      # Pinning it here means the release step exercises the .pyc path.
      uses: actions/setup-python@v6
      with:
        python-version: '3.14'
    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: '17'
    - name: Set up the Android SDK
      # The action's default `packages` is "tools platform-tools", but the
      # legacy `tools` package is gone from Google's SDK repository, so
      # `sdkmanager tools` exits 1 and fails the step. Nothing here uses it;
      # cmdline-tools (installed by the action) is its replacement.
      uses: android-actions/setup-android@v4
      with:
        packages: platform-tools
    - name: Install kivyforge (with the Android extra)
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev,android]"
    - name: Install the pinned NDK, CMake, platform, and build-tools
      # The NDK version is kivyforge's own pin, emitted into the generated
      # app/build.gradle, so the one AGP resolves must be that one — not
      # whichever the runner image happens to ship. Read it from the source of
      # truth so a toolchain bump can't leave this workflow behind.
      #
      # build-tools is named explicitly to guarantee a floor: the release
      # signature step below resolves `apksigner` out of
      # <sdk>/build-tools/*/, and without this line that step's ability to run
      # at all would depend on the runner image still shipping one.
      #
      # It does not pin which one runs. `_find_apksigner` takes the newest
      # version directory, deliberately (it is what AGP resolves to), so on an
      # image that already ships a newer build-tools this install is the
      # fallback rather than the selection — the 2026-09-22 run used 37.0.0
      # from the image, not the 35.0.0 installed here.
      run: |
        ndk="$(python -c 'from kivyforge.platforms.android.toolchain import NDK_VERSION; print(NDK_VERSION)')"
        echo "Installing NDK ${ndk}"
        sdkmanager --install "ndk;${ndk}" "cmake;3.22.1" "platforms;android-35" \
          "build-tools;35.0.0"
    - name: Doctor (Android)
      # Advisory: doctor is allowed to report the known-interim Kivy wheel
      # (4 KB-aligned) as a FAIL, so this step must not gate the build.
      continue-on-error: true
      working-directory: ${{ env.APP_DIR }}
      run: kivyforge doctor -p android
    - name: Build the debug APK (assembleDebug)
      working-directory: ${{ env.APP_DIR }}
      run: kivyforge build -p android --debug --abi "$ABI"
    - name: Assert the debug APK is the artifact the build promised (T3)
      # Replaces three `unzip -l | grep` presence checks with the full T3 pass
      # (tests/artifact_checks.py): required entries, single-ABI ELF machine
      # match, no shared object stranded in the payload, and — for the release
      # step below — .pyc-only with a magic the shipped runtime can import.
      # Debug does not strip, so --android-stripped is deliberately absent here;
      # this run asserts the *source* payload shape instead.
      run: |
        apk="$(ls "$APP_DIR"/hello-android-android/app/build/outputs/apk/debug/*.apk)"
        pytest tests/platforms/android/test_apk_artifact.py -q --no-cov \
          --android-apk "$apk" --android-abi "$ABI"
    - name: Exercise the release policy path (lintRelease + merged manifest)
      # `package` is the only path that runs the curated lintRelease subset and
      # the merged-manifest policy pass, and both live in generated Groovy — so
      # a throwaway keystore is worth it to keep that code honest.
      working-directory: ${{ env.APP_DIR }}
      env:
        KIVYFORGE_KEYSTORE_PASSWORD: ci-not-a-secret
      run: |
        keytool -genkeypair -noprompt -keystore ci.keystore -alias ci \
          -storepass "$KIVYFORGE_KEYSTORE_PASSWORD" \
          -keypass "$KIVYFORGE_KEYSTORE_PASSWORD" \
          -keyalg RSA -keysize 2048 -validity 30 -dname "CN=kivyforge CI"
        kivyforge package -p android --abi "$ABI" \
          --keystore ci.keystore --key-alias ci
    - name: Assert the release APK is stripped and byte-compiled (T3)
      # The gate roadmap item 1 needed and did not have. byte_compile and
      # strip_source both default to "release", so this APK has been stripped and
      # byte-compiled all along — CI simply never looked. It asserts .pyc-only, an
      # `app/main.pyc` in the legacy sourceless layout, no __pycache__, and every
      # .pyc carrying the magic this job's pinned CPython writes (which is why the
      # setup-python pin above is load-bearing, not incidental).
      run: |
        apk="$APP_DIR/hello-android-android/app/build/outputs/apk/release/app-release.apk"
        pytest tests/platforms/android/test_apk_artifact.py -q --no-cov \
          --android-apk "$apk" --android-abi "$ABI" --android-stripped
    - name: Assert the merged release manifest says what pyproject.toml declared (T3)
      # `package` exported this manifest already, for the policy lint to read,
      # and the job then threw it away on success — the same "CI produced the
      # evidence and never looked at it" shape as item 1 (test-matrix.md §5.1).
      # Policy lints the *posture*; this checks the *content*: applicationId,
      # versionCode/versionName and min/target SDK (all injected by AGP out of
      # build.gradle, so no generation test can cover them), every declared
      # permission, feature, service and intent-filter, and that no manifest
      # placeholder survived unresolved.
      run: |
        manifest="$APP_DIR/hello-android-android/app/build/kivyforge/AndroidManifest-merged-release.xml"
        pytest tests/platforms/android/test_merged_manifest.py -q --no-cov \
          --android-merged-manifest "$manifest" --android-project "$APP_DIR"
    - name: Assert the release APK's signature verifies (T3)
      # `apksigner verify` at the project's own min_sdk, against the release
      # APK signed by the throwaway keystore above. Release-only on purpose:
      # a debug APK's signature is Gradle's, not the project's, so the
      # v1_signing comparison would be meaningless on one.
      #
      # KIVYFORGE_REQUIRE_TOOLCHAIN turns a missing `apksigner` into a failure
      # rather than a skip: this job installs build-tools explicitly above, so
      # its absence is a broken workflow, and a green run that verified no
      # signature at all is exactly the silent-skip failure this tier exists
      # to remove (test-matrix.md §2).
      env:
        KIVYFORGE_REQUIRE_TOOLCHAIN: '1'
      run: |
        apk="$APP_DIR/hello-android-android/app/build/outputs/apk/release/app-release.apk"
        pytest tests/platforms/android/test_apk_signature.py -q --no-cov \
          --android-apk "$apk" --android-project "$APP_DIR"
    - name: Upload the generated project on failure (for triage)
      if: failure()
      uses: actions/upload-artifact@v6
      with:
        name: android-generated-project
        path: |
          ${{ env.APP_DIR }}/hello-android-android/app/build.gradle
          ${{ env.APP_DIR }}/hello-android-android/settings.gradle
          ${{ env.APP_DIR }}/hello-android-android/app/src/main/AndroidManifest.xml
          ${{ env.APP_DIR }}/hello-android-android/app/build/reports/
          ${{ env.APP_DIR }}/hello-android-android/app/build/kivyforge/

  # macOS integration: the full suite runs here too (pbxproj generation and
  # xcodebuild/simctl command construction get real-macOS coverage). The live
  # `kivyforge build --simulator` / `kivyforge run` smoke test against a
  # pure-Python app on the BeeWare runtime is wired in once the iOS
  # Python.xcframework + wheels are published (spec 03/04).
  macos_integration:
    name: Integration (macOS)
    runs-on: macos-latest
    steps:
    - name: Checkout kivyforge
      uses: actions/checkout@v6
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.x'
    - name: Install kivyforge and test dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"
    - name: Run pytest
      # This is the only job that can build the Mach-O launcher, and those tests
      # self-skip when clang is absent — so require the toolchain rather than
      # letting the runner image quietly drop the one thing this job adds.
      env:
        KIVYFORGE_REQUIRE_TOOLCHAIN: '1'
      run: pytest -q
